<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Name - Digital Card</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p { font-size: 0.95rem; color: #94a3b8; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #334155;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #38bdf8; color: #0f172a; }
    .btn.primary { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://via.placeholder.com/150" alt="Profile Photo" />
    <h1>Juan Dela Cruz</h1>
    <p>Business Owner • Olongapo City</p>

    <a class="btn primary" href="tel:+639123456789">📞 Call / Save Number</a>
    <a class="btn" href="https://facebook.com/" target="_blank">Facebook</a>
    <a class="btn" href="https://tiktok.com/" target="_blank">TikTok</a>
    <a class="btn" href="https://instagram.com/" target="_blank">Instagram</a>
  </div>
</body>
</html>
