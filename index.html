<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARD-TAP Digital Profile</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p { font-size: 0.95rem; color: #94a3b8; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #334155;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .btn.primary { background: #38bdf8; color: #0f172a; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card" id="profile">
    <p>Loading card...</p>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqI4RA4ZxD6jAcJ3sBR5t5R3KZ0Xin6ZsEpZ9V_PVRwCwnBq3hLnlJwA0f1jW3JMPiT_38DLVV3idD/pub?gid=0&single=true&output=csv";

    const params = new URLSearchParams(window.location.search);
    const cardId = params.get("id") || "01";

    function parseCSV(text) {
      return text.trim().split("\n").map(row =>
        row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, "").trim())
      );
    }

    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(csv => {
        const rows = parseCSV(csv);
        const headers = rows[0];
        const match = rows.slice(1).find(r => r[0] === cardId);

        if (!match) {
          document.getElementById("profile").innerHTML = "<h1>Card Ready to Activate</h1><p>ID: " + cardId + "</p>";
          return;
        }

        const data = {};
        headers.forEach((h, i) => data[h] = match[i] || "");

        document.title = (data.name || "Digital Card") + " - CARD-TAP";
        document.getElementById("profile").innerHTML = `
          <img class="avatar" src="${data.photo || 'https://via.placeholder.com/150'}" alt="Profile" />
          <h1>${data.name || "Card #" + cardId}</h1>
          <p>${data.bio || ""}</p>
          ${data.phone ? `<a class="btn primary" href="tel:${data.phone}">📞 Call / Save Number</a>` : ""}
          ${data.facebook ? `<a class="btn" href="${data.facebook}" target="_blank">Facebook</a>` : ""}
          ${data.tiktok ? `<a class="btn" href="${data.tiktok}" target="_blank">TikTok</a>` : ""}
          ${data.instagram ? `<a class="btn" href="${data.instagram}" target="_blank">Instagram</a>` : ""}
        `;
      })
      .catch(() => {
        document.getElementById("profile").innerHTML = "<h1>Error loading profile</h1><p>Check your Google Sheet link.</p>";
      });
  </script>
</body>
</html>
